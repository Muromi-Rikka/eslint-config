name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test base
        run: pnpm --filter @renton/eslint-config test

      - name: Test frontend
        run: pnpm --filter @renton/eslint-config-frontend test

      - name: Test react
        run: pnpm --filter @renton/eslint-config-react test

      - name: Test vue
        run: pnpm --filter @renton/eslint-config-vue test

      - name: Type check
        run: pnpm tsc --noEmit
