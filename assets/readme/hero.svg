<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">@renton/eslint-config</title>
  <desc id="hero-desc">Modular ESLint flat config monorepo with opinionated defaults for TypeScript, React, Vue, and frontend projects.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="#0d1117"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#8b949e" stroke-width="0.5">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 50)">
    <!-- Category tag -->
    <g>
      <rect width="136" height="26" rx="13" fill="#5865F2" fill-opacity="0.15" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="68" y="17.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#5865F2" font-weight="600"
            letter-spacing="0.5">ESLINT FLAT CONFIG</text>
    </g>

    <!-- Project name -->
    <text x="0" y="76"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="46" fill="#e6edf3" font-weight="700"
          letter-spacing="-0.5">@renton/eslint-config</text>

    <!-- Description -->
    <text x="0" y="112"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8b949e">
      Modular ESLint flat config with opinionated defaults
    </text>
    <text x="0" y="140"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8b949e">
      TypeScript-first · Composable · Zero-config start
    </text>

    <!-- Feature pills -->
    <g transform="translate(0 170)">
      <g>
        <rect width="96" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="48" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#7ee787">TypeScript</text>
      </g>
      <g transform="translate(104 0)">
        <rect width="56" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="28" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#79c0ff">React</text>
      </g>
      <g transform="translate(168 0)">
        <rect width="48" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="24" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#41b883">Vue</text>
      </g>
      <g transform="translate(224 0)">
        <rect width="76" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="38" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#d2a8ff">Stylistic</text>
      </g>
      <g transform="translate(308 0)">
        <rect width="72" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="36" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#ffa657">Unicorn</text>
      </g>
    </g>

    <!-- Install command -->
    <g transform="translate(0 222)">
      <rect width="420" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5865F2">$</text>
      <text x="30" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#8b949e">pnpm add -D</text>
      <text x="138" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#e6edf3" font-weight="600">@renton/eslint-config</text>
    </g>
  </g>

  <!-- Right: Layered architecture -->
  <g id="module-arch" transform="translate(680 44)">

    <!-- Layer 3 (top): React + Vue -->
    <g transform="translate(0 10)">
      <!-- React box -->
      <g>
        <rect width="210" height="56" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
        <circle cx="24" cy="28" r="12" fill="#79c0ff" fill-opacity="0.15"/>
        <text x="24" y="33" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="14" fill="#79c0ff" font-weight="700">R</text>
        <text x="44" y="22"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#e6edf3" font-weight="600">eslint-config-react</text>
        <text x="44" y="40"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="10" fill="#8b949e">Next.js · TanStack Query · Router</text>
      </g>

      <!-- Vue box -->
      <g transform="translate(222 0)">
        <rect width="210" height="56" rx="10" fill="#161b22" stroke="#41b883" stroke-width="1.5"/>
        <circle cx="24" cy="28" r="12" fill="#41b883" fill-opacity="0.15"/>
        <text x="24" y="33" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="14" fill="#41b883" font-weight="700">V</text>
        <text x="44" y="22"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#e6edf3" font-weight="600">eslint-config-vue</text>
        <text x="44" y="40"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="10" fill="#8b949e">Vue 3 · vue-i18n</text>
      </g>
    </g>

    <!-- Arrow: frontend → react/vue -->
    <path d="M220 70 L105 102" stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
    <path d="M220 70 L337 102" stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>

    <!-- Layer 2 (middle): Frontend -->
    <g transform="translate(80 104)">
      <rect width="280" height="56" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="24" cy="28" r="12" fill="#79c0ff" fill-opacity="0.1"/>
      <text x="24" y="33" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#79c0ff" font-weight="700">F</text>
      <text x="44" y="22"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#e6edf3" font-weight="600">eslint-config-frontend</text>
      <text x="44" y="40"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">extends base + Tailwind CSS</text>
    </g>

    <!-- Arrow: base → frontend -->
    <path d="M220 164 L220 196" stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>

    <!-- Layer 1 (bottom): Base -->
    <g transform="translate(40 200)">
      <rect width="360" height="56" rx="10" fill="#161b22" stroke="#5865F2" stroke-width="1.5"/>
      <circle cx="24" cy="28" r="12" fill="#5865F2" fill-opacity="0.15"/>
      <text x="24" y="33" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5865F2" font-weight="700">B</text>
      <text x="44" y="22"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#e6edf3" font-weight="600">@renton/eslint-config</text>
      <text x="44" y="40"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">TypeScript · Stylistic · Unicorn · Perfectionist · Regexp · JSDoc</text>
    </g>

    <!-- Side: extends label -->
    <g transform="translate(410 216)">
      <text x="0" y="12"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="11" fill="#484f58" font-style="italic">extends ↑</text>
    </g>

  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="376" width="1200" height="4" rx="2" fill="url(#accent-grad)" opacity="0.6"/>
</svg>
