<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">@renton/eslint-config</title>
  <desc id="hero-desc">Opinionated ESLint flat config for TypeScript projects with 14 integrated plugins.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="#0d1117"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#8b949e" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 48)">
    <!-- Category tag -->
    <g>
      <rect width="170" height="26" rx="13" fill="#5865F2" fill-opacity="0.15" stroke="#5865F2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="85" y="17.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#5865F2" font-weight="600"
            letter-spacing="0.5">ESLINT FLAT CONFIG</text>
    </g>

    <!-- Package name -->
    <text x="0" y="76"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="44" fill="#e6edf3" font-weight="700"
          letter-spacing="-0.5">@renton/eslint-config</text>

    <!-- Description -->
    <text x="0" y="112"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8b949e">
      Opinionated ESLint flat config for TypeScript projects
    </text>

    <!-- Feature pills -->
    <g transform="translate(0 140)">
      <g>
        <rect width="96" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="48" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#7ee787">TypeScript</text>
      </g>
      <g transform="translate(104 0)">
        <rect width="76" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="38" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#d2a8ff">Stylistic</text>
      </g>
      <g transform="translate(188 0)">
        <rect width="72" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="36" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#ffa657">Unicorn</text>
      </g>
      <g transform="translate(268 0)">
        <rect width="100" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="50" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#79c0ff">Perfectionist</text>
      </g>
      <g transform="translate(376 0)">
        <rect width="60" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="30" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#41b883">Regexp</text>
      </g>
    </g>

    <!-- Install command -->
    <g transform="translate(0 192)">
      <rect width="420" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#5865F2">$</text>
      <text x="30" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#8b949e">pnpm add -D</text>
      <text x="138" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#e6edf3" font-weight="600">@renton/eslint-config</text>
    </g>
  </g>

  <!-- Right: Plugin grid -->
  <g id="plugin-grid" transform="translate(660 40)">
    <!-- Row 1 -->
    <g transform="translate(0 0)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">TypeScript</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">typescript-eslint</text>
    </g>
    <g transform="translate(130 0)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Stylistic</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">@stylistic</text>
    </g>
    <g transform="translate(260 0)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Unicorn</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">unicorn</text>
    </g>
    <g transform="translate(390 0)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Perfectionist</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">sorting</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0 54)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Regexp</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">regexp</text>
    </g>
    <g transform="translate(130 54)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">JSDoc</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">jsdoc</text>
    </g>
    <g transform="translate(260 54)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Node.js</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">eslint-plugin-n</text>
    </g>
    <g transform="translate(390 54)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">JSONC</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">jsonc</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0 108)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">YAML</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">yml</text>
    </g>
    <g transform="translate(130 108)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Markdown</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">@eslint/markdown</text>
    </g>
    <g transform="translate(260 108)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Imports</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">import-lite</text>
    </g>
    <g transform="translate(390 108)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Comments</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">eslint-comments</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0 162)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Unused</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">unused-imports</text>
    </g>
    <g transform="translate(130 162)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Command</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">directives</text>
    </g>
    <g transform="translate(260 162)">
      <rect width="120" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#e6edf3" font-weight="600">Gitignore</text>
      <text x="60" y="34" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">auto-ignore</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" rx="2" fill="url(#accent-grad)" opacity="0.6"/>
</svg>
