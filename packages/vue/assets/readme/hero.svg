<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">@renton/eslint-config-vue</title>
  <desc id="hero-desc">Opinionated ESLint flat config for Vue 3 projects with vue-i18n and Tailwind CSS support.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="#0d1117"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#8b949e" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 48)">
    <!-- Category tag -->
    <g>
      <rect width="140" height="26" rx="13" fill="#41b883" fill-opacity="0.15" stroke="#41b883" stroke-opacity="0.3" stroke-width="1"/>
      <text x="70" y="17.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#41b883" font-weight="600"
            letter-spacing="0.5">VUE 3 · I18N · TAILWIND</text>
    </g>

    <!-- Package name -->
    <text x="0" y="76"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="42" fill="#e6edf3" font-weight="700"
          letter-spacing="-0.5">@renton/eslint-config-vue</text>

    <!-- Description -->
    <text x="0" y="112"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8b949e">
      ESLint flat config for Vue 3 projects
    </text>
    <text x="0" y="138"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18" fill="#8b949e">
      Extends base config with Vue, vue-i18n, Tailwind
    </text>

    <!-- Feature pills -->
    <g transform="translate(0 168)">
      <g>
        <rect width="48" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="24" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#41b883">Vue</text>
      </g>
      <g transform="translate(56 0)">
        <rect width="48" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="24" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#41b883">SFC</text>
      </g>
      <g transform="translate(112 0)">
        <rect width="56" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="28" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#ffa657">i18n</text>
      </g>
      <g transform="translate(176 0)">
        <rect width="80" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="40" y="18.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#38bdf8">Tailwind</text>
      </g>
    </g>

    <!-- Install command -->
    <g transform="translate(0 220)">
      <rect width="430" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#41b883">$</text>
      <text x="30" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#8b949e">pnpm add -D</text>
      <text x="138" y="26"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#e6edf3" font-weight="600">@renton/eslint-config-vue</text>
    </g>
  </g>

  <!-- Right: Layered architecture -->
  <g id="module-arch" transform="translate(680 40)">
    <!-- Top: Vue core -->
    <g transform="translate(20 0)">
      <rect width="240" height="52" rx="10" fill="#161b22" stroke="#41b883" stroke-width="1.5"/>
      <circle cx="24" cy="26" r="12" fill="#41b883" fill-opacity="0.15"/>
      <text x="24" y="31" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="14" fill="#41b883" font-weight="700">V</text>
      <text x="44" y="20"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#e6edf3" font-weight="600">eslint-plugin-vue</text>
      <text x="44" y="38"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">Vue 3 SFC rules</text>
    </g>

    <!-- Middle: Vue i18n -->
    <g transform="translate(40 64)">
      <rect width="200" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#e6edf3" font-weight="600">@intlify/vue-i18n</text>
      <text x="100" y="38" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">opt-in · vueI18nLocaleDir</text>
    </g>

    <!-- Middle: Tailwind -->
    <g transform="translate(40 124)">
      <rect width="200" height="48" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#e6edf3" font-weight="600">Tailwind CSS</text>
      <text x="100" y="38" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="10" fill="#8b949e">opt-in · tailwindcssConfigPath</text>
    </g>

    <!-- Arrow -->
    <path d="M140 176 L140 204" stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>

    <!-- Inherits from base -->
    <g transform="translate(20 208)">
      <rect width="240" height="40" rx="8" fill="#161b22" stroke="#5865F2" stroke-width="1" stroke-opacity="0.5"/>
      <text x="120" y="16" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="11" fill="#8b949e">inherits all</text>
      <text x="120" y="32" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#5865F2" font-weight="600">@renton/eslint-config</text>
    </g>

    <!-- extends label -->
    <g transform="translate(270 220)">
      <text x="0" y="12"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="11" fill="#484f58" font-style="italic">extends ↑</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" rx="2" fill="url(#accent-grad)" opacity="0.6"/>
</svg>
