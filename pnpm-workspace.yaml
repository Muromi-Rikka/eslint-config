minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# @babel/core (via eslint-plugin-react-hooks) pins semver@^6; 6.3.1 is the newest 6.x
trustPolicyExclude:
  - semver@6.3.1

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  eslint: ^10.13.0
  tsdown: ^0.23.1
  typescript: ^6.0.3

catalogs:
  dev:
    "@antfu/install-pkg": ^2.1.0
    "@changesets/changelog-github": ^1.0.1
    "@changesets/cli": ^3.0.3
    "@clack/prompts": ^1.8.1
    "@types/node": ^26.6.5
    ansis: ^4.4.0
    cac: ^7.1.0
    eslint-typegen: ^2.3.1
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    tsx: ^4.23.15
    vitest: ^5.0.5
  plugins:
    "@eslint-community/eslint-plugin-eslint-comments": ^4.8.1
    "@eslint-react/eslint-plugin": ^5.28.1
    "@eslint/js": ^10.0.1
    "@eslint/markdown": ^8.0.3
    "@intlify/eslint-plugin-vue-i18n": ^4.5.1
    "@next/eslint-plugin-next": ^16.4.2
    "@stylistic/eslint-plugin": ^5.10.0
    "@tanstack/eslint-plugin-query": ^5.104.4
    "@tanstack/eslint-plugin-router": ^1.162.0
    "@vitest/eslint-plugin": ^1.6.27
    eslint-config-flat-gitignore: ^2.4.0
    eslint-flat-config-utils: ^3.2.0
    eslint-plugin-antfu: ^3.2.3
    eslint-plugin-baseline-js: ^0.7.5
    eslint-plugin-command: ^4.0.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-import-lite: ^0.6.0
    eslint-plugin-jsdoc: ^65.3.12
    eslint-plugin-jsonc: ^3.4.2
    eslint-plugin-n: ^18.5.0
    eslint-plugin-no-only-tests: ^3.4.0
    eslint-plugin-perfectionist: ^5.12.1
    eslint-plugin-pnpm: ^1.9.1
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.7
    eslint-plugin-regexp: ^3.3.1
    eslint-plugin-slop: ^0.1.1
    eslint-plugin-sonarjs: ^4.2.0
    eslint-plugin-tailwindcss: ^4.4.0
    eslint-plugin-unicorn: ^78.0.0
    eslint-plugin-unused-imports: ^4.4.1
    eslint-plugin-vue: ^10.11.1
    eslint-plugin-yml: ^3.9.0
    find-up-simple: ^1.0.1
    globals: ^17.13.0
    jsonc-eslint-parser: ^3.3.0
    local-pkg: ^1.2.1
    typescript-eslint: ^8.71.2
    vue-eslint-parser: ^10.4.1
    yaml-eslint-parser: ^2.1.0

